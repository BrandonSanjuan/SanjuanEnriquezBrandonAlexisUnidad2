<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | FinanTrack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #1f2937;
        }

        .contenedor {
            width: 90%;
            max-width: 430px;
            background-color: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            color: #172554;
            margin-bottom: 5px;
        }

        .subtitulo {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1d4ed8;
        }

        .boton {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #1d4ed8;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .boton:hover {
            background-color: #1e40af;
        }

        .error {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .informacion {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1 class="logo">FinanTrack</h1>

        <p class="subtitulo">
            Sistema de Control de Gastos
        </p>

        {% if form.errors %}
            <div class="error">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="boton">
                Iniciar sesión
            </button>

        </form>

        <div class="informacion">
            Ingresa tus datos para acceder a tu panel financiero.
        </div>

    </div>

</body>
</html>
