<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agregar movimiento | FinanTrack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #1f2937;
        }

        header {
            background-color: #172554;
            color: white;
            padding: 20px;
        }

        .header-content {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            margin: 0;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .formulario {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .formulario h2 {
            margin-top: 0;
            color: #172554;
        }

        .formulario p {
            color: #6b7280;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #1d4ed8;
        }

        .botones {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .boton {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        .guardar {
            background-color: #1d4ed8;
            color: white;
        }

        .guardar:hover {
            background-color: #1e40af;
        }

        .volver {
            background-color: #e5e7eb;
            color: #374151;
        }

        .volver:hover {
            background-color: #d1d5db;
        }

        .errores {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .formulario {
                padding: 20px;
            }

            .botones {
                flex-direction: column;
            }

            .boton {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">
        <h1 class="logo">FinanTrack</h1>

        <span>
            Nuevo movimiento
        </span>
    </div>
</header>

<main>

    <section class="formulario">

        <h2>Agregar movimiento</h2>

        <p>
            Registra un ingreso o gasto para llevar el control de tus finanzas.
        </p>

        {% if form.errors %}
            <div class="errores">
                Revisa los datos ingresados e intenta nuevamente.
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="botones">

                <button type="submit" class="boton guardar">
                    Guardar movimiento
                </button>

                <a href="{% url 'inicio' %}" class="boton volver">
                    Cancelar
                </a>

            </div>

        </form>

    </section>

</main>

</body>
</html>
